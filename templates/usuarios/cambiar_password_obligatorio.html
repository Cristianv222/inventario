{% load static %}
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cambia tu contraseña · VP Motos</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#0f172a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:28px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{height:40px;display:block;margin:0 auto 10px}.logo-box{background:#0f172a;border-radius:10px;padding:6px 14px;display:inline-flex}</style>
<link rel="manifest" href="/manifest-tecnico.json">
<meta name="theme-color" content="#8bc53f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Panel">
<link rel="apple-touch-icon" href="/static/img/icon-192.png">
</head>
<body>
<div class="box">
  <div class="text-center mb-3"><span class="logo-box"><img src="{% static 'logo_vp.png' %}" class="logo" alt="VP Motos" style="margin:0"></span></div>
  <h5 class="fw-bold text-center">Cambia tu contraseña</h5>
  <p class="text-muted small text-center">Por seguridad, debes definir una contraseña nueva antes de continuar.</p>
  {% if messages %}{% for m in messages %}<div class="alert alert-{% if m.tags == "error" %}danger{% else %}{{ m.tags }}{% endif %} py-2 small">{{ m }}</div>{% endfor %}{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3"><label class="form-label small fw-bold">Nueva contraseña</label><input type="password" name="password1" class="form-control" required minlength="6" placeholder="Mínimo 6 caracteres"></div>
    <div class="mb-3"><label class="form-label small fw-bold">Repite la contraseña</label><input type="password" name="password2" class="form-control" required minlength="6"></div>
    <button class="btn btn-primary w-100 fw-bold" type="submit">Guardar y continuar</button>
  </form>
  <div class="text-center mt-3"><a href="/usuarios/logout/" onclick="event.preventDefault();document.getElementById('lf').submit();" class="small text-muted">Cerrar sesión</a>
    <form id="lf" method="post" action="/usuarios/logout/" style="display:none">{% csrf_token %}</form></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function (e) { console.warn('[PWA] SW error:', e); });
  });
}
</script>
</body>
</html>
